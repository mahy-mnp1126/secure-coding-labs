# VULNERABLE workflow
name: build
on: pull_request_target           # runs with secrets and a write token, even for forks
permissions: write-all
jobs:
  build:
    if: github.repository == 'lab-safety/this-workflow-never-runs'   # LAB SAFETY SWITCH
    runs-on: [ self-hosted ]      # on-prem runner, reachable from any PR
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}       # checks out untrusted code
      - run: echo "Building ${{ github.event.pull_request.title }}"   # script injection
      - run: mvn -B verify
      - uses: some-org/deploy-action@main                      # mutable reference
