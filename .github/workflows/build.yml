# Builds and tests the backend on every pull request and push to main.
# This is also a worked example of a hardened workflow (Module 5):
# no default permissions, actions pinned to commit SHAs, no persisted credentials.
name: build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Lab checks (tagged "lab") are excluded here: they fail until each lab is solved.
      - run: ./mvnw -B verify
